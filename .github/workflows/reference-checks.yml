name: Reference checks

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run reference checks
        run: pnpm check:all

      - name: Dry-run every installation profile
        shell: bash
        env:
          STACKS_TMP: ${{ runner.temp }}
        run: |
          for profile in profiles/*.json; do
            name="$(basename "$profile" .json)"
            target="$STACKS_TMP/stacks-dry-run/$name"
            mkdir -p "$target"
            node scripts/stacks/install.mjs --target "$target" --profile "$name" --dry-run
          done

      - name: Install a profile twice to prove idempotence
        shell: bash
        env:
          STACKS_TMP: ${{ runner.temp }}
        run: |
          target="$STACKS_TMP/stacks-install"
          mkdir -p "$target"
          node scripts/stacks/install.mjs --target "$target" --profile python-api-docker
          test -f "$target/.agents/stacks.lock.json"
          node scripts/stacks/install.mjs --target "$target" --profile python-api-docker | tee "$STACKS_TMP/stacks-reinstall.log"
          grep -qx 'Result: no changes' "$STACKS_TMP/stacks-reinstall.log"
